name: Level 2 PR Quality Gate
on:
  pull_request:
    branches: [main, "feat/**", "qa/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Unit and integration tests
        run: npm test
      - name: Syntax verification
        run: |
          find src tests -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Production build (no deployment)
        run: npm run build

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#17233a" />
    <meta name="description" content="Ça Va Péter! — a fictional Paris indie arcade game. Early playable visual prototype." />
    <title>ÇA VA PÉTER! — Level 1 Prototype</title>
  </head>
  <body>
    <div id="app">
      <main id="game" aria-label="Game viewport"></main>
      <header class="topbar">
        <div class="brand">ÇA VA <span>PÉTER!</span></div>
        <span class="build">LEVEL 1 • VISUAL PROTOTYPE</span>
      </header>
      <section class="hud" aria-live="polite">
        <strong>EXPLORE PARIS</strong>
        <p>Move with <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or arrow keys.</p>
        <p id="coords">Position: 0, 0</p>
      </section>
      <footer>Fictional setting · No live protest data · Early development build</footer>
      <div id="error" role="alert" hidden></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
